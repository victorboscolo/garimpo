version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: garimpo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garimpo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-garimpo}
    volumes:
      - garimpo_postgres_data:/var/lib/postgresql/data
    ports:
      # 127.0.0.1 explícito: "5432:5432" publica em todas as interfaces, o que
      # deixa o banco alcançável por qualquer aparelho na mesma rede. Enquanto
      # não houver autenticação, o acesso fica restrito à própria máquina.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garimpo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: garimpo_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Mesmo motivo do postgres: a API não tem autenticação nenhuma, e sem o
      # 127.0.0.1 explícito qualquer aparelho na rede poderia aprovar, rejeitar
      # ou injetar promoções. O coletor nativo e o painel continuam funcionando,
      # pois ambos acessam pela própria máquina.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload


volumes:
  garimpo_postgres_data:
