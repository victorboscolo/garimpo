<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garimpo — Painel de Revisão</title>
<style>
  :root {
    --stone-50: #F3F0EA;
    --stone-100: #E8E3D9;
    --stone-200: #D8D0C0;
    --stone-700: #4A4438;
    --stone-900: #2B2721;
    --ink: #232019;

    --excepcional: #B8862E;
    --excepcional-bg: #FBF1DD;
    --excelente: #4F7A5C;
    --excelente-bg: #E9F2EB;
    --boa: #4B7FA6;
    --boa-bg: #E7F0F6;
    --comum: #8A7E5C;
    --comum-bg: #F1EDDF;
    --pouco: #A65B4B;
    --pouco-bg: #F6E9E6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--stone-50);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--stone-200);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .login-overlay {
    position: fixed;
    inset: 0;
    background: var(--stone-50);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  /* Sem isto, o `display: flex` acima empata em especificidade com a regra
     `[hidden]` do navegador e vence por vir depois no CSS — o atributo
     `hidden` setado via JS deixaria de esconder o overlay de verdade. */
  .login-overlay[hidden] { display: none; }

  .login-card {
    background: white;
    border: 1px solid var(--stone-200);
    border-radius: 14px;
    padding: 32px 30px;
    width: 320px;
  }

  .login-card .brand { margin-bottom: 4px; }
  .login-card .subtitle { margin-bottom: 22px; }

  .login-card label {
    display: block;
    font-size: 12px;
    color: var(--stone-700);
    margin-bottom: 4px;
    margin-top: 14px;
  }

  .login-card input {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--stone-200);
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
  }

  .login-card button {
    width: 100%;
    margin-top: 20px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--stone-900);
    color: var(--stone-50);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .login-erro {
    color: var(--pouco);
    font-size: 13px;
    margin-top: 12px;
    min-height: 16px;
  }

  .usuario-logado {
    font-size: 12px;
    color: var(--stone-700);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .usuario-logado[hidden] { display: none; }

  .usuario-logado button {
    background: none;
    border: 1px solid var(--stone-200);
    border-radius: 8px;
    padding: 3px 9px;
    font-size: 11px;
    cursor: pointer;
    color: var(--stone-700);
  }

  .brand .accent { color: var(--excepcional); }

  .subtitle {
    font-size: 13px;
    color: var(--stone-700);
    margin-top: 2px;
  }

  .tabs {
    display: flex;
    gap: 4px;
  }

  .tab {
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--stone-200);
    background: white;
    color: var(--stone-700);
  }

  .tab.active {
    background: var(--stone-900);
    color: var(--stone-50);
    border-color: var(--stone-900);
  }

  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 28px 32px 80px;
  }

  .status-line {
    font-size: 13px;
    color: var(--stone-700);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-line button {
    background: none;
    border: 1px solid var(--stone-200);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    color: var(--stone-700);
  }

  .card {
    background: white;
    border: 1px solid var(--stone-200);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: start;
  }

  .card-main { min-width: 0; }

  /* Destaques em grade — 2 ou 3 colunas, o que couber na largura (18/09,
     pedido do usuário), em vez da lista de uma coluna só das outras abas. */
  .lista-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 12px;
  }
  .lista-grid .empty-state { grid-column: 1 / -1; }

  /* Card resumido de Destaques: o clique é no card inteiro, não num link
     pequeno — precisa parecer clicável de propósito. Mais compacto que o
     card cheio das outras abas, pra caber vários por linha. */
  .card-destaque {
    cursor: pointer;
    grid-template-columns: 1fr;
    padding: 14px 16px;
    margin-bottom: 0;
    transition: border-color 0.15s;
  }
  .card-destaque:hover { border-color: var(--stone-700); }
  .card-destaque .parceiro-nome { font-size: 15px; }
  .card-destaque .pontuacao { margin-bottom: 6px; font-size: 13px; }
  .card-destaque .categoria-badge { margin-bottom: 4px; }

  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .parceiro-nome {
    font-size: 17px;
    font-weight: 600;
  }

  .programa-tag {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--stone-700);
    background: var(--stone-100);
    padding: 2px 8px;
    border-radius: 6px;
  }

  .origem-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 500;
  }
  .origem-COLETOR { background: var(--boa-bg); color: var(--boa); }
  .origem-MANUAL { background: var(--comum-bg); color: var(--comum); }
  .origem-IMPORTACAO { background: var(--stone-100); color: var(--stone-700); }

  .coletado-em {
    font-size: 12px;
    color: var(--stone-700);
    margin-bottom: 8px;
  }

  .pontuacao {
    font-size: 14px;
    color: var(--stone-700);
    margin-bottom: 10px;
  }

  .pontuacao b { color: var(--ink); }

  /* "Até X pontos" é teto anunciado, não valor garantido — precisa saltar aos
     olhos, porque são justamente essas ofertas que lideram o ranking. */
  .tag-condicionada {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--pouco-bg);
    color: var(--pouco);
    border: 1px solid var(--pouco);
    vertical-align: 1px;
  }

  .clube-extra { color: var(--boa); font-weight: 600; }

  /* Valor anterior da oferta. Discreto de propósito: contextualiza o número
     principal sem competir com ele. */
  .pontuacao-anterior {
    font-size: 12px;
    color: var(--stone-700);
    font-style: italic;
  }

  /* Selo "Promoção" da própria Livelo. Fica junto das tags de origem e
     programa, não junto da nota — é metadado da oferta, não avaliação. */
  .tag-promocao {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--excelente-bg);
    color: var(--excelente);
    cursor: help;
  }

  .aviso-condicionada {
    font-size: 12px;
    line-height: 1.45;
    color: var(--pouco);
    background: var(--pouco-bg);
    border-left: 3px solid var(--pouco);
    padding: 7px 10px;
    border-radius: 0 7px 7px 0;
    margin: -4px 0 10px;
    max-width: 58ch;
  }

  .categoria-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 8px;
    margin-bottom: 8px;
  }

  .justificativa {
    font-size: 13px;
    color: var(--stone-700);
    line-height: 1.5;
    max-width: 60ch;
  }

  .loading-inline {
    font-size: 12px;
    color: var(--stone-700);
    font-style: italic;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 110px;
  }

  button.acao {
    border: none;
    border-radius: 9px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-aprovar {
    background: var(--excelente);
    color: white;
  }
  .btn-aprovar:hover { background: #3f6549; }

  /* button.acao define border:none e tem especificidade maior que .btn-rejeitar
     sozinho — sem o seletor composto, a borda pretendida aqui não aparece. */
  button.acao.btn-rejeitar {
    background: white;
    color: var(--pouco);
    border: 1px solid var(--pouco);
  }
  .btn-rejeitar:hover { background: var(--pouco-bg); }

  .status-pill {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 5px 10px;
    border-radius: 7px;
    text-align: center;
  }
  .status-APROVADA { background: var(--excelente-bg); color: var(--excelente); }
  .status-REJEITADA { background: var(--pouco-bg); color: var(--pouco); }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--stone-700);
  }

  .empty-state .big { font-size: 40px; margin-bottom: 8px; }

  /* Prévia da mensagem como ela vai chegar no Telegram. Monoespaçada de
     propósito: é para conferir o texto, não para parecer bonito. */
  .previa {
    background: var(--stone-900);
    color: var(--stone-50);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    max-width: 62ch;
  }

  .canal-tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--boa-bg);
    color: var(--boa);
  }

  .aviso-config {
    background: var(--pouco-bg);
    color: var(--pouco);
    border-left: 3px solid var(--pouco);
    padding: 10px 14px;
    border-radius: 0 8px 8px 0;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  a.link-origem {
    font-size: 12px;
    color: var(--boa);
    text-decoration: none;
  }
  a.link-origem:hover { text-decoration: underline; }

  /* ---- Seleção múltipla ---- */

  .card { grid-template-columns: auto 1fr auto; }
  .card.sem-selecao { grid-template-columns: 1fr auto; }

  .card-sel { padding-top: 2px; }
  .card-sel input { width: 17px; height: 17px; cursor: pointer; accent-color: var(--stone-900); }

  .card.selecionado {
    border-color: var(--stone-900);
    box-shadow: 0 0 0 1px var(--stone-900);
  }

  .selecao-tudo {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }
  .selecao-tudo input { width: 15px; height: 15px; cursor: pointer; accent-color: var(--stone-900); }

  /* O atributo `hidden` aplica display:none pela folha do navegador, que perde
     para o `display: flex` acima. Sem esta regra, esconder o seletor não
     funciona. */
  .selecao-tudo[hidden] { display: none; }

  .barra-lote {
    position: sticky;
    bottom: 0;
    margin-top: 16px;
    background: var(--stone-900);
    color: var(--stone-50);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    box-shadow: 0 6px 24px rgba(0,0,0,0.18);
  }
  .barra-lote.oculta { display: none; }
  .barra-lote .contagem { font-size: 14px; font-weight: 600; flex: 1; }
  .barra-lote button {
    border: none;
    border-radius: 9px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .barra-lote .lote-aprovar { background: var(--excelente); color: white; }
  .barra-lote .lote-rejeitar { background: var(--pouco); color: white; }
  .barra-lote .lote-limpar {
    background: transparent;
    color: var(--stone-200);
    border: 1px solid var(--stone-700);
  }

  /* ---- Selos e painel de detalhes ---- */

  .selos { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 4px; }
  .selo {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--comum-bg);
    color: var(--comum);
  }

  /* Sem o cupom o cliente não pontua. É a única condição que zera o benefício,
     então fica na linha do nome do parceiro, com o código junto — quem bate o
     olho no card já sai sabendo o que precisa aplicar no carrinho. */
  .tag-cupom {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--excepcional-bg);
    color: var(--excepcional);
    border: 1px solid var(--excepcional);
    cursor: help;
  }

  /* Texto real da campanha, vindo da página de regras do parceiro. É onde a
     restrição aparece: o card da listagem nunca a menciona. */
  .regulamento-campanha {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--stone-700);
    background: var(--stone-50);
    border: 1px solid var(--stone-100);
    border-radius: 8px;
    padding: 8px 11px;
    margin: 0 0 10px;
    max-width: 62ch;
  }

  .toggle-detalhes {
    background: none;
    border: none;
    padding: 6px 0 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--stone-700);
    cursor: pointer;
  }
  .toggle-detalhes:hover { color: var(--ink); }

  .detalhes {
    margin-top: 10px;
    padding: 14px 16px;
    background: var(--stone-50);
    border: 1px solid var(--stone-100);
    border-radius: 10px;
  }
  .detalhes.oculto { display: none; }

  .detalhes h4 {
    margin: 0 0 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--stone-700);
    font-weight: 600;
  }
  .detalhes h4:not(:first-child) { margin-top: 18px; }

  .criterio {
    display: grid;
    grid-template-columns: 150px 1fr 42px;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .criterio-nome { color: var(--stone-700); }
  .criterio-barra { background: var(--stone-100); border-radius: 4px; height: 7px; overflow: hidden; }
  /* display:block — um <span> inline ignora width e a barra não aparece. */
  .criterio-preenchida { display: block; background: var(--boa); height: 100%; border-radius: 4px; }
  .criterio-valor { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

  .campo { font-size: 12.5px; line-height: 1.5; margin-bottom: 7px; }
  .campo .rotulo { color: var(--stone-700); }
  .campo .valor { color: var(--ink); }
  .sem-dados { font-size: 12px; color: var(--stone-700); font-style: italic; }

  /* ---- Painel de Saúde ---- */

  .saude-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 6px;
  }
  .saude-OK { background: var(--excelente-bg); color: var(--excelente); }
  .saude-FALHA { background: var(--pouco-bg); color: var(--pouco); }
  .saude-ATRASADA { background: var(--comum-bg); color: var(--comum); }
  .saude-NUNCA_RODOU { background: var(--stone-100); color: var(--stone-700); }

  /* ---- Emissões: comparativo lado a lado ---- */

  .valor-emissao-data { font-size: 12px; color: var(--stone-700); margin-left: auto; }

  .comparativo-emissao {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 10px 0 6px;
  }
  .opcao-emissao {
    border: 1px solid var(--stone-200);
    border-radius: 10px;
    padding: 12px 14px;
    background: var(--stone-50);
  }
  .opcao-vazia { display: flex; flex-direction: column; justify-content: center; }
  .opcao-rotulo {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--stone-700);
    margin-bottom: 6px;
  }
  .opcao-preco { font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.25; }
  .opcao-unidade { font-size: 12px; font-weight: 600; color: var(--stone-700); }
  .opcao-detalhe { font-size: 12px; color: var(--stone-700); margin-top: 3px; }
  .opcao-sem-oferta { font-size: 12.5px; color: var(--stone-700); font-style: italic; }

  @media (max-width: 640px) {
    .comparativo-emissao { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="login-overlay" id="login-overlay" hidden>
  <div class="login-card">
    <div class="brand">Garimpo <span class="accent">Promoções</span></div>
    <div class="subtitle">Entrar no painel</div>
    <form id="form-login" onsubmit="fazerLogin(event)">
      <label for="login-email">E-mail</label>
      <input type="email" id="login-email" required autocomplete="username">
      <label for="login-senha">Senha</label>
      <input type="password" id="login-senha" required autocomplete="current-password">
      <button type="submit">Entrar</button>
      <div class="login-erro" id="login-erro"></div>
    </form>
  </div>
</div>

<header>
  <div>
    <div class="brand">Garimpo <span class="accent">Promoções</span></div>
    <div class="subtitle">Painel de revisão do Motor de Análise V1</div>
  </div>
  <div class="tabs">
    <div class="tab active" data-filtro="__DESTAQUES__">Destaques</div>
    <div class="tab" data-filtro="PENDENTE">Pendentes</div>
    <div class="tab" data-filtro="APROVADA">Aprovadas</div>
    <div class="tab" data-filtro="REJEITADA">Rejeitadas</div>
    <div class="tab" data-filtro="">Todas</div>
    <div class="tab" data-filtro="__PUBLICAR__">Publicar</div>
    <div class="tab" data-filtro="__SAUDE__">Saúde</div>
    <div class="tab" data-filtro="__EMISSOES__">Emissões</div>
  </div>
  <div class="usuario-logado" id="usuario-logado" hidden>
    <span id="usuario-nome"></span>
    <button onclick="sair()">Sair</button>
  </div>
</header>

<main>
  <div class="status-line">
    <span id="contador">Carregando…</span>
    <label class="selecao-tudo" id="wrap-selecao-tudo" hidden>
      <input type="checkbox" id="selecionar-tudo" onchange="alternarTodas(this.checked)">
      <span id="label-selecao-tudo">Selecionar todas</span>
    </label>
    <button onclick="carregar()">↻ Atualizar</button>
    <button id="btn-reprocessar" onclick="reprocessarTodas()">⚙ Reprocessar tudo</button>
  </div>
  <div id="lista"></div>

  <div class="barra-lote oculta" id="barra-lote">
    <span class="contagem" id="contagem-lote"></span>
    <span id="acoes-lote">
      <button class="lote-limpar" onclick="limparSelecao()">Limpar</button>
      <button class="lote-rejeitar" onclick="rejeitarLote()">Rejeitar selecionadas</button>
      <button class="lote-aprovar" onclick="aprovarLote()">Aprovar selecionadas</button>
    </span>
  </div>
</main>

<script>
// Login por usuário (18/09) — painel e API são a mesma origem, então a
// sessão vive num cookie httponly; não precisa de token manipulado em JS.
// `_fetchOriginal` é interceptado uma vez só, aqui, pra qualquer 401 de
// qualquer chamada (as ~15 chamadas fetch já existentes no resto do
// arquivo não precisam saber disso) mandar de volta pra tela de login,
// inclusive se a sessão cair no meio do uso (expirou, ou foi de outra
// aba).
const _fetchOriginal = window.fetch;
window.fetch = async function (...args) {
  const resposta = await _fetchOriginal(...args);
  const url = typeof args[0] === "string" ? args[0] : args[0]?.url || "";
  if (resposta.status === 401 && url.startsWith("/api/v1/") && !url.includes("/auth/")) {
    mostrarLogin();
  }
  return resposta;
};

function mostrarLogin() {
  document.getElementById("login-overlay").hidden = false;
  document.getElementById("usuario-logado").hidden = true;
}

function mostrarPainel(usuario) {
  document.getElementById("login-overlay").hidden = true;
  document.getElementById("usuario-logado").hidden = false;
  document.getElementById("usuario-nome").textContent = usuario.nome;
}

async function fazerLogin(evento) {
  evento.preventDefault();
  const email = document.getElementById("login-email").value;
  const senha = document.getElementById("login-senha").value;
  const erroEl = document.getElementById("login-erro");
  erroEl.textContent = "";

  const resposta = await _fetchOriginal("/api/v1/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, senha }),
  });

  if (!resposta.ok) {
    erroEl.textContent = "E-mail ou senha inválidos.";
    return;
  }

  const usuario = await resposta.json();
  mostrarPainel(usuario);
  carregar();
}

async function sair() {
  await fetch("/api/v1/auth/logout", { method: "POST" });
  mostrarLogin();
}

async function iniciar() {
  const resposta = await _fetchOriginal("/api/v1/auth/me");
  if (resposta.ok) {
    mostrarPainel(await resposta.json());
    carregar();
  } else {
    mostrarLogin();
  }
}

};

const STATUS_LABEL = {
  PENDENTE: "Pendente", APROVADA: "Aprovada", REJEITADA: "Rejeitada", PUBLICADA: "Publicada",
};

// Preenchido a cada `carregar()`, para os painéis de histórico (abertos sob
// demanda) acharem parceiro_id sem precisar de uma requisição extra só pra isso.
const promocoesCache = {};

document.querySelectorAll(".tab").forEach(tab => {

// Ids selecionados para ação em lote. Zerado a cada carregamento da lista.
const selecionadas = new Set();

// O conteúdo vem de um site externo via coletor: escapar antes de injetar.
function esc(valor) {
  if (valor === null || valor === undefined) return "";
  return String(valor)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}

async function carregar() {
  if (filtroAtual === "__PUBLICAR__") return carregarFila();
  if (filtroAtual === "__SAUDE__") return carregarSaude();

  contador.textContent = "Carregando…";

  const url = filtroAtual === "__DESTAQUES__"
    ? `${API_BASE}/destaques`
    : filtroAtual
      ? `${API_BASE}?status=${filtroAtual}`
      : `${API_BASE}`;

  let promocoes;
  try {
    const resp = await fetch(url);
    promocoes = await resp.json();
  } catch (e) {
    contador.textContent = "Erro ao carregar. A API está rodando em localhost:8000?";
    return;
  }

  if (promocoes.length === 0) {
    contador.textContent = "0 promoções";
    lista.innerHTML = `<div class="empty-state"><div class="big">🔍</div>Nada por aqui ainda.</div>`;

  contador.textContent = `${promocoes.length} promoç${promocoes.length === 1 ? "ão" : "ões"}, ordenadas pela nota`;

  document.getElementById("btn-reprocessar").hidden = false;
  document.getElementById("acoes-lote").innerHTML = `
    <button class="lote-limpar" onclick="limparSelecao()">Limpar</button>
    <button class="lote-rejeitar" onclick="rejeitarLote()">Rejeitar selecionadas</button>
    <button class="lote-aprovar" onclick="aprovarLote()">Aprovar selecionadas</button>
  `;
  const pendentes = promocoes.filter(p => p.status === "PENDENTE").length;

  document.getElementById("selecionar-tudo").checked = false;

  const destaques = filtroAtual === "__DESTAQUES__";

  for (const p of promocoes) {
    promocoesCache[p.id] = p;
    const selecionavel = !destaques && p.status === "PENDENTE";

      <div class="card-sel">

          ${p.em_promocao ? '<span class="tag-promocao" title="A Livelo marca esta oferta como campanha ativa — ela é temporária. Mede coisa diferente da nota: a nota diz se a oferta é boa, este selo diz que ela vai expirar.">Promoção</span>' : ""}
          ${p.requer_cupom ? `<span class="tag-cupom" title="Sem aplicar este cupom no carrinho, o cliente não pontua. É a única condição que zera o benefício.">🎫 Cupom${p.cupom ? " " + esc(p.cupom) : ""}</span>` : ""}
        </div>

const selecionadasFila = new Set();

function chaveFila(promocaoId, tipo) { return `${promocaoId}|${tipo}`; }

async function carregarFila() {
  selecionadasFila.clear();
  const lista = document.getElementById("lista");
  const contador = document.getElementById("contador");
  document.getElementById("wrap-selecao-tudo").hidden = true;
  document.getElementById("barra-lote").classList.add("oculta");
  lista.innerHTML = "";
  contador.textContent = "Carregando fila…";

  let dados;
  try {
    dados = await (await fetch("/api/v1/publicacoes/fila")).json();
  } catch (e) {
    contador.textContent = "Erro ao carregar a fila.";
    return;
  }

  contador.textContent = `${dados.total} mensagem(ns) na fila · modo ${dados.modo}`;
  document.getElementById("btn-reprocessar").hidden = true;

  // Divergência é silenciosa por natureza: sem este aviso, o canal segue
  // afirmando algo que o motor já não sustenta e ninguém percebe.
  try {
    const div = await (await fetch("/api/v1/publicacoes/divergencias")).json();
    if (div.total > 0) {
      const aviso = document.createElement("div");
      aviso.className = "aviso-config";
      aviso.innerHTML = `
        <b>${div.total} publicação(ões) mudaram de categoria depois de enviadas.</b><br>
        O canal continua mostrando a avaliação antiga — não há como despublicar no Telegram.
        <div style="margin-top:8px">` +
        div.itens.map(i => `${esc(i.parceiro)} <span class="canal-tag">${esc(i.canal)}</span> — publicado como <b>${esc(i.categoria_publicada)}</b>, hoje é <b>${esc(i.categoria_atual)}</b>`).join("<br>") +
        `</div>`;
      lista.appendChild(aviso);
    }
  } catch (e) { /* o aviso não pode impedir a fila de aparecer */ }

  // Aprovação individual não reclassifica sozinha (decisão de custo — ver
  // aprovar_promocao); este aviso é o substituto, avisando quando isso deixou
  // a fila com nota potencialmente desatualizada.
  try {
    const aviso = await (await fetch("/api/v1/publicacoes/aviso-reclassificacao")).json();
    if (aviso.pendente) {
      const bloco = document.createElement("div");
      bloco.className = "aviso-config";
      bloco.innerHTML = `
        <b>${aviso.quantidade} aprovação(ões) individual(is) aconteceram depois da última reclassificação geral.</b><br>
        A nota de outras promoções pode não refletir essas aprovações ainda.
        <div style="margin-top:8px">
          <button onclick="reprocessarTodas()">🔁 Reprocessar tudo agora</button>
        </div>
      `;
      lista.appendChild(bloco);
    }
  } catch (e) { /* o aviso não pode impedir a fila de aparecer */ }

  if (dados.total === 0) {
    lista.innerHTML = `<div class="empty-state"><div class="big">✅</div>Nada na fila. Aprove promoções para que apareçam aqui.</div>`;
    return;
  }

  // Não existe despublicar no Telegram: a conferência tem que caber antes.
  const barra = document.createElement("div");
  barra.className = "status-line";
  barra.innerHTML = `
    <button onclick="testarConfiguracao()">🔌 Testar configuração</button>
    <label class="selecao-tudo">
      <input type="checkbox" onchange="alternarTodasFila(this.checked)">
      <span>Selecionar todas (${dados.total})</span>
    </label>
  `;
  lista.appendChild(barra);

  for (const item of dados.itens) {
    const chave = chaveFila(item.promocao_id, item.tipo);
    const card = document.createElement("div");
    card.className = "card";
    card.id = `fila-${chave}`;
    card.innerHTML = `
      <div class="card-sel">
        <input type="checkbox" data-chave="${esc(chave)}"
               onchange="alternarUmaFila('${esc(chave)}', this.checked)">
      </div>
      <div class="card-main">
        <div class="card-top">
          <span class="parceiro-nome">${esc(item.parceiro)}</span>
          <span class="canal-tag">${esc(item.tipo)}</span>
        </div>
        <div class="previa">${esc(item.mensagem)}</div>
      </div>
      <div class="actions"></div>
    `;
    lista.appendChild(card);
  }
  atualizarBarraFila();
}

function alternarUmaFila(chave, marcada) {
  if (marcada) selecionadasFila.add(chave); else selecionadasFila.delete(chave);
  const card = document.getElementById(`fila-${chave}`);
  if (card) card.classList.toggle("selecionado", marcada);
  atualizarBarraFila();
}

function alternarTodasFila(marcada) {
  document.querySelectorAll(".card-sel input[data-chave]").forEach(cb => {
    cb.checked = marcada;
    alternarUmaFila(cb.dataset.chave, marcada);
  });
}

function limparSelecaoFila() {
  document.querySelectorAll(".card-sel input[data-chave]").forEach(cb => cb.checked = false);
  alternarTodasFila(false);
}

function atualizarBarraFila() {
  const barra = document.getElementById("barra-lote");
  const n = selecionadasFila.size;
  barra.classList.toggle("oculta", n === 0);
  // O Telegram limita o ritmo de mensagens a um mesmo canal: avisar o tempo
  // evita a impressão de travamento quando a leva é grande.
  const minutos = Math.ceil((n - 1) * 30 / 60);
  const tempo = n > 1 ? ` · ~${minutos} min` : "";
  document.getElementById("contagem-lote").textContent =
    `${n} mensage${n === 1 ? "m" : "ns"} selecionada${n === 1 ? "" : "s"}${tempo}`;
  document.getElementById("acoes-lote").innerHTML = `
    <button class="lote-limpar" onclick="limparSelecaoFila()">Limpar</button>
    <button class="lote-rejeitar" onclick="descartarSelecionadas()">Descartar selecionadas</button>
    <button class="lote-aprovar" onclick="publicarSelecionadas()">Publicar selecionadas</button>
  `;
}

function itensSelecionadosDaFila() {
  return [...selecionadasFila].map(c => {
    const [promocao_id, tipo] = c.split("|");
    return { promocao_id, tipo };
  });
}

function formatDataVoo(isoDate) {
  const [ano, mes, dia] = isoDate.split("-");
  return `${dia}/${mes}/${ano}`;
}

// Nome por extenso dos códigos IATA que os coletores já trouxeram — a
// Smiles já devolve nome completo (ex: "GOL Linhas Aéreas"), então o
// fallback pro próprio código cobre qualquer companhia nova sem quebrar.
const NOME_COMPANHIA = {
  AF: "Air France", BA: "British Airways", IB: "Iberia", TP: "TAP Portugal",
  AD: "Azul", G3: "GOL", LA: "LATAM", CM: "Copa Airlines",
  AA: "American Airlines", DL: "Delta", UA: "United Airlines",
  AZ: "ITA Airways", LH: "Lufthansa",
};
function nomeCompanhia(codigo) {
  if (!codigo) return null;
  return NOME_COMPANHIA[codigo] || codigo;
}

// Uma linha por (rota, categoria) — agrupa em "GIG → LHR (Azul)" com até
// duas colunas, Direto e Com parada (decisão do usuário, 17/09: as duas
// categorias continuam separadas, nenhuma escolhida como "a" oferta).
function agruparPorRota(ofertas) {
  const porRota = new Map();
  for (const o of ofertas) {
    const chave = `${o.programa_nome}|${o.origem}|${o.destino}`;
    if (!porRota.has(chave)) {
      porRota.set(chave, { programa_nome: o.programa_nome, origem: o.origem, destino: o.destino, categorias: {} });
    }
    porRota.get(chave).categorias[o.categoria] = o;
  }
  return Array.from(porRota.values());
}

// Layout de comparativo: as duas categorias lado a lado, preço em
// destaque — pra comparar rápido, do jeito que se compara preço de
// verdade, não uma lista de campos empilhados.
function renderOpcaoEmissao(rotulo, o) {
  if (!o) {
    return `
      <div class="opcao-emissao opcao-vazia">
        <div class="opcao-rotulo">${rotulo}</div>
        <div class="opcao-sem-oferta">Sem oferta encontrada ainda</div>
      </div>
    `;
  }
  // Azul chama de "pontos"; Smiles e LATAM chamam de "milhas" — mesma
  // moeda, nome diferente por programa.
  const unidade = o.programa_nome === "Azul" ? "pontos" : "milhas";
  const paradasTexto = o.paradas === 0 ? "Voo direto" : `${o.paradas} parada${o.paradas === 1 ? "" : "s"}`;
  const cia = nomeCompanhia(o.companhia_operadora);
  return `
    <div class="opcao-emissao">
      <div class="opcao-rotulo">${rotulo}</div>
      <div class="opcao-preco">${o.pontos.toLocaleString("pt-BR")} <span class="opcao-unidade">${unidade}</span></div>
      <div class="opcao-detalhe">${esc(paradasTexto)}${o.duracao_texto ? ` · ${esc(o.duracao_texto)}` : ""}</div>
      ${cia ? `<div class="opcao-detalhe">${esc(cia)}</div>` : ""}
    </div>
  `;
}

async function carregarEmissoes() {
  const lista = document.getElementById("lista");
  const contador = document.getElementById("contador");
  document.getElementById("wrap-selecao-tudo").hidden = true;
  document.getElementById("barra-lote").classList.add("oculta");
  document.getElementById("btn-reprocessar").hidden = true;
  lista.innerHTML = "";
  contador.textContent = "Carregando emissões…";

  let ofertas;
  try {
    ofertas = await (await fetch("/api/v1/emissoes/ofertas")).json();
  } catch (e) {
    contador.textContent = "Erro ao carregar. A API está rodando em localhost:8000?";
    return;
  }

  if (ofertas.length === 0) {
    contador.textContent = "0 rotas com oferta ainda";
    lista.innerHTML = `<div class="empty-state"><div class="big">✈️</div>Nenhuma oferta coletada ainda.</div>`;
    return;
  }

  const rotas = agruparPorRota(ofertas).sort((a, b) =>
    a.programa_nome.localeCompare(b.programa_nome) || a.origem.localeCompare(b.origem) || a.destino.localeCompare(b.destino)
  );
  contador.textContent = `${rotas.length} rota${rotas.length === 1 ? "" : "s"} com oferta, só em milhas`;

  for (const rota of rotas) {
    const opcoes = [rota.categorias.DIRETO, rota.categorias.COM_PARADA].filter(Boolean);
    const maisRecente = opcoes.sort((a, b) => new Date(b.coletado_em) - new Date(a.coletado_em))[0];
    // As duas categorias vêm da mesma busca (mesma data/classe) — mostra
    // isso uma vez só no topo, não repetido em cada coluna.
    const referencia = opcoes[0];
    const card = document.createElement("div");
    card.className = "card sem-selecao";
    card.innerHTML = `
      <div class="card-main">
        <div class="card-top">
          <span class="parceiro-nome">${esc(rota.origem)} → ${esc(rota.destino)}</span>
          <span class="programa-tag">${esc(rota.programa_nome)}</span>
          <span class="valor-emissao-data">${formatDataVoo(referencia.data_ida)} · ${esc(referencia.classe)}</span>
        </div>
        <div class="comparativo-emissao">
          ${renderOpcaoEmissao("Direto", rota.categorias.DIRETO)}
          ${renderOpcaoEmissao("Com parada", rota.categorias.COM_PARADA)}
        </div>
        <div class="coletado-em">Coletado em ${formatData(maisRecente.coletado_em)}</div>
      </div>
    `;
    lista.appendChild(card);
  }
}

async function descartarSelecionadas() {
  const itens = itensSelecionadosDaFila();
  if (itens.length === 0) return;
  if (!confirm(`Descartar ${itens.length} da fila?\n\nElas não serão publicadas e somem da lista. Nada é enviado ao Telegram.`)) return;

  const r = await (await fetch("/api/v1/publicacoes/descartar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ itens }),
  })).json();
  alert(`${r.descartadas} descartada(s).`);
  carregarFila();
}

async function publicarSelecionadas() {
  const itens = itensSelecionadosDaFila();
  if (itens.length === 0) return;

  const minutos = Math.ceil((itens.length - 1) * 30 / 60);
  const aviso = itens.length > 1 ? `\n\nVai levar cerca de ${minutos} minuto(s) — há uma pausa entre os envios para não esbarrar no limite do Telegram.` : "";
  if (!confirm(`Publicar ${itens.length} mensagem(ns) no Telegram?${aviso}\n\nNão há como despublicar depois.`)) return;

  const contador = document.getElementById("contador");
  contador.textContent = `Publicando ${itens.length}…`;

  const r = await (await fetch("/api/v1/publicacoes/despachar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ itens }),
  })).json();

  if (r.erro) { alert(`Não foi possível publicar.\n\n${r.erro}`); carregarFila(); return; }
  alert(`${r.enviadas} enviada(s), ${r.falhas} falha(s), de ${r.total}.`);
  carregarFila();
}

async function testarConfiguracao() {
  const r = await (await fetch("/api/v1/publicacoes/diagnostico")).json();
  const linhas = r.canais.map(c => {
    if (c.erro) return `❌ ${c.canal}\n   ${c.erro}`;
    const permissao = c.pode_publicar ? "pode publicar" : "SEM permissão de publicar";
    return `✅ ${c.canal}\n   bot ${c.bot} · canal "${c.canal_nome}" · ${permissao}`;
  });
  alert("Configuração do Telegram\n\n" + linhas.join("\n\n"));
}

async function despachar(limite) {
  const quantos = limite === null ? "TODAS as mensagens da fila" : `as ${limite} primeiras`;
  if (!confirm(`Publicar ${quantos} no Telegram?\n\nNão há como despublicar depois.`)) return;

  const url = "/api/v1/publicacoes/despachar" + (limite === null ? "" : `?limite=${limite}`);
  const r = await (await fetch(url, { method: "POST" })).json();

  if (r.erro) {
    alert(`Não foi possível publicar.\n\n${r.erro}`);
    return;
  }
  alert(`${r.enviadas} enviada(s), ${r.falhas} falha(s), de ${r.total}.`);
  carregarFila();
}

function renderPontuacao(p) {
  // O número grande continua liderando — é a informação real da campanha e o
  // que dá apelo à publicação. O qualificador vem colado nele, nunca escondido:
  // a Beleza na Web anuncia "até 8" e paga 4 na maior parte da loja.
  const clube = p.pontuacao_clube
    ? ` <span class="clube-extra">· ${esc(p.pontuacao_clube)} no Clube</span>`
    : "";

  // O salto é o que faz a notícia: de 1 para 100 é relevante, de 2 para 3 não.
  const anterior = p.pontuacao_anterior
    ? ` <span class="pontuacao-anterior">eram ${esc(p.pontuacao_anterior)}</span>`
    : "";

  const aviso = p.valor_condicionado ? `
    <div class="aviso-condicionada">
      Este valor não vale para a compra inteira — costuma se aplicar só a
      certas categorias, marcas ou produtos. Veja o regulamento abaixo.
    </div>` : "";

  return `
    <div class="pontuacao">
      ${p.valor_condicionado ? '<span class="tag-condicionada" title="O valor exibido não vale para a compra inteira: ou o card anuncia &quot;Até&quot;, ou o regulamento cita uma pontuação menor para o restante da loja.">⚠ condicionada</span> ' : ""}
      <b>${esc(p.pontuacao)}</b> ${esc(formatUnidade(p.unidade_pontuacao))}${clube}${anterior}
    </div>
    ${aviso}`;
}

// Card resumido da aba Destaques (18/09, pedido do usuário): só o essencial
// pra reconhecer a oferta de cara — parceiro, programa, cupom, pontuação e
// nota. O resto (regulamento, justificativa, selos, link) mora atrás de um
// clique no card inteiro, reaproveitando o mesmo `det-${id}`/`alternarDetalhes`
// dos outros cards — é a mesma seção de detalhes, só que escondida por padrão
// aqui e visível de cara nas outras abas.
function renderCardDestaque(p) {
  const c = p.classificacao_ativa;
  const info = c ? (CATEGORIA_INFO[c.categoria] || { label: c.categoria, cor: "comum" }) : null;
  const nota = info ? `
    <div class="categoria-badge" style="background: var(--${info.cor}-bg); color: var(--${info.cor});">
      ${info.label} · nota ${Number(c.nota).toFixed(0)}
    </div>` : "";

  return `
    <div class="card-main">
      <div class="card-top">
        <span class="parceiro-nome">${esc(p.parceiro_nome)}</span>
        <span class="programa-tag">${esc(p.programa_nome)}</span>
        ${p.requer_cupom ? `<span class="tag-cupom" title="Sem aplicar este cupom no carrinho, o cliente não pontua.">🎫 Cupom${p.cupom ? " " + esc(p.cupom) : ""}</span>` : ""}
      </div>
      ${renderPontuacao(p)}
      ${nota}
      <div class="toggle-detalhes" id="btn-det-${p.id}">▸ Ver detalhes</div>
      <div class="detalhes oculto" id="det-${p.id}" onclick="event.stopPropagation()">
        ${renderRegulamento(p)}
        ${c ? `<div class="justificativa">${esc(c.justificativa)}</div>` : ""}
        ${renderSelos(p)}
        ${renderDetalhes(p)}
        <a class="link-origem" href="${esc(p.url_origem)}" target="_blank">Ver oferta original ↗</a>
      </div>
    </div>`;
}

function renderClassificacao(p) {
  const c = p.classificacao_ativa;
  if (!c) return `<span class="loading-inline">Sem classificação ainda.</span>`;
  const info = CATEGORIA_INFO[c.categoria] || { label: c.categoria, cor: "comum" };
  return `
    <div class="categoria-badge" style="background: var(--${info.cor}-bg); color: var(--${info.cor});">
      ${info.label} · nota ${Number(c.nota).toFixed(0)}
    </div>
    <div class="justificativa">${esc(c.justificativa)}</div>
  `;
}

// O regulamento sintético que o coletor escrevia sobre si mesmo não é
// restrição nenhuma — só o texto real da campanha interessa aqui.
//
// Antes verificava a presença de "campanha válida" — frase específica da
// Livelo que a Esfera nunca usa (0 dos 168 regulamentos reais dela contêm
// isso), então nenhum card da Esfera mostrava este bloco, mesmo tendo
// regulamento completo. A checagem certa é o oposto: só não é real quando
// bate o placeholder antigo ("Coletado do site oficial...").
function temRegulamentoReal(p) {
  return !!p.regulamento_texto && !/^coletado do site oficial/i.test(p.regulamento_texto.trim());
}

function renderRegulamento(p) {
  if (!temRegulamentoReal(p)) return "";
  return `<div class="regulamento-campanha">${esc(p.regulamento_texto)}</div>`;
}

function renderSelos(p) {
  const selos = [];

  // O cupom não entra aqui: sobe para a linha de tags, junto do nome do
  // parceiro, porque é a condição que zera o benefício se ignorada e precisa
  // ser vista antes de qualquer outra coisa do card.
  if (p.data_fim) {
    selos.push(`<span class="selo">🗓 Válida até ${formatDataCurta(p.data_fim)}</span>`);
  }
  // Onde a compra é feita muda quanto se pontua, e o cliente costuma descobrir
  // tarde demais. Só aparece quando o regulamento afirma — nunca por dedução.
  if (p.marketplace_status === "PROIBIDO") {
    selos.push(`<span class="selo selo-marketplace">🏪 Só vendido e entregue pela loja</span>`);
  } else if (p.marketplace_status === "PARCIAL") {
    selos.push(`<span class="selo selo-marketplace">🏪 Marketplace pontua menos</span>`);
  }
  if (p.requer_clube) {
    selos.push(`<span class="selo">🏷 Exige Clube${p.qual_clube ? ": " + esc(p.qual_clube) : ""}</span>`);
  }
  if (p.disponibilidade && p.disponibilidade !== "PUBLICA") {
    selos.push(`<span class="selo">🔒 ${esc(p.disponibilidade)}</span>`);
  }

  if (selos.length === 0) return "";
  return `<div class="selos">${selos.join("")}</div>`;
}

// Validade de campanha é data de calendário, não instante: a Livelo diz "até
// 17/08", não "até 17/08 às 00h de algum fuso". Gravamos meia-noite UTC, então
// formatar no fuso local (UTC−3) exibiria 16/08 — um dia a menos, o que faria
// uma oferta ainda válida parecer vencida.
function formatDataCampanha(isoString, opcoes) {
  return new Date(isoString).toLocaleDateString("pt-BR", { timeZone: "UTC", ...opcoes });
}

function formatDataCurta(isoString) {
  return formatDataCampanha(isoString, { day: "2-digit", month: "2-digit" });
}

const CRITERIO_LABEL = {
  historico: "Histórico",
  atratividade: "Atratividade",
  amplitude: "Amplitude",
  facilidade: "Facilidade",
  exclusividade: "Exclusividade",
  confiabilidade_dados: "Confiabilidade dos dados",
};

function renderDetalhes(p) {
  const c = p.classificacao_ativa;
  let html = "";

  if (c && c.criterios_avaliados) {
    html += `<h4>Critérios do motor</h4>`;
    for (const [chave, label] of Object.entries(CRITERIO_LABEL)) {
      const valor = c.criterios_avaliados[chave];
      if (valor === undefined) continue;
      html += `
        <div class="criterio">
          <span class="criterio-nome">${label}</span>
          <span class="criterio-barra"><span class="criterio-preenchida" style="width:${Number(valor)}%"></span></span>
          <span class="criterio-valor">${Number(valor).toFixed(0)}</span>
        </div>`;
    }
    html += `<div class="campo" style="margin-top:10px">
      <span class="rotulo">Confiança do histórico:</span>
      <span class="valor">${esc(c.confianca_historica)}</span>
      <span class="rotulo"> · Confiabilidade dos dados:</span>
      <span class="valor">${Number(c.confiabilidade_dados).toFixed(0)}</span>
    </div>`;
  }

  // Só campos preenchidos: com quase tudo vazio hoje, exibir rótulo vazio
  // encheria a tela de nada.
  const campos = [
    ["Restrições", p.restricoes],
    ["Abrangência", p.abrangencia],
    ["Marketplace", p.marketplace_status],
    ["Resumo do regulamento", p.regulamento_resumo],
    ["Regulamento", p.regulamento_texto],
    ["Início", p.data_inicio ? formatDataCampanha(p.data_inicio, { day: "2-digit", month: "2-digit", year: "numeric" }) : null],
    ["Fim", p.data_fim ? formatDataCampanha(p.data_fim, { day: "2-digit", month: "2-digit", year: "numeric" }) : null],
    ["Código", p.codigo_amigavel],
  ].filter(([, valor]) => valor !== null && valor !== undefined && valor !== "");

  html += `<h4>Dados da oferta</h4>`;
  if (campos.length === 0) {
    html += `<div class="sem-dados">Nenhum dado adicional coletado para esta oferta.</div>`;
  } else {
    html += campos.map(([rotulo, valor]) =>
      `<div class="campo"><span class="rotulo">${rotulo}:</span> <span class="valor">${esc(valor)}</span></div>`
    ).join("");
  }

  // As duas seções abaixo só carregam quando o card é aberto (ver
  // `alternarDetalhes`) — abrir todas de cara faria duas requisições por
  // promoção da lista inteira, a maioria delas nunca vista pelo validador.
  html += `<h4>Histórico da nota</h4>
    <div class="sem-dados" id="historico-nota-${p.id}">Carregando…</div>`;
  html += `<h4>Ofertas anteriores do parceiro</h4>
    <div class="sem-dados" id="historico-parceiro-${p.id}">Carregando…</div>`;

  return html;
}

// Ids cujo histórico já foi buscado — abrir/fechar/reabrir o mesmo card não
// deve refazer as requisições.
const historicoCarregado = new Set();

function alternarDetalhes(id) {
  const painel = document.getElementById(`det-${id}`);
  const botao = document.getElementById(`btn-det-${id}`);
  const abrindo = painel.classList.contains("oculto");
  painel.classList.toggle("oculto");
  botao.textContent = abrindo ? "▾ Ocultar detalhes" : "▸ Ver detalhes";

  if (abrindo && !historicoCarregado.has(id)) {
    historicoCarregado.add(id);
    carregarHistoricoNota(id);
    carregarHistoricoParceiro(id);
  }
}

async function carregarHistoricoNota(id) {
  const alvo = document.getElementById(`historico-nota-${id}`);
  try {
    const resp = await fetch(`${API_BASE}/${id}/classificacoes`);
    const classificacoes = await resp.json();
    alvo.outerHTML = renderHistoricoNota(id, classificacoes);
  } catch (e) {
    alvo.textContent = "Não foi possível carregar o histórico da nota.";
  }
}

function renderHistoricoNota(id, classificacoes) {
  if (!classificacoes || classificacoes.length <= 1) {
    return `<div class="sem-dados" id="historico-nota-${id}">Classificada uma única vez até agora, ainda sem reprocessamento.</div>`;
  }
  const linhas = classificacoes.map(c => {
    const info = CATEGORIA_INFO[c.categoria] || { label: c.categoria };
    return `<div class="campo">
      <span class="rotulo">${formatData(c.processada_em)}${c.ativa ? " (atual)" : ""}:</span>
      <span class="valor">${Number(c.nota).toFixed(1)} · ${esc(info.label)}</span>
    </div>`;
  }).join("");
  return `<div id="historico-nota-${id}">${linhas}</div>`;
}

// Quantas ofertas anteriores mostrar antes de resumir o resto — um parceiro
// coletado todo dia há meses não pode virar uma lista sem fim dentro do card.
const LIMITE_HISTORICO_PARCEIRO = 15;

async function carregarHistoricoParceiro(id) {
  const alvo = document.getElementById(`historico-parceiro-${id}`);
  const promocao = promocoesCache[id];
  if (!promocao) return;
  try {
    const resp = await fetch(`${API_BASE}?parceiro_id=${promocao.parceiro_id}`);
    const ofertas = (await resp.json())
      .filter(o => o.id !== id)
      .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    alvo.outerHTML = renderHistoricoParceiro(id, ofertas);
  } catch (e) {
    alvo.textContent = "Não foi possível carregar o histórico do parceiro.";
  }
}

function renderHistoricoParceiro(id, ofertas) {
  if (ofertas.length === 0) {
    return `<div class="sem-dados" id="historico-parceiro-${id}">Esta é a primeira oferta coletada deste parceiro.</div>`;
  }
  const mostrar = ofertas.slice(0, LIMITE_HISTORICO_PARCEIRO);
  let linhas = mostrar.map(o => {
    const nota = o.classificacao_ativa
      ? `${Number(o.classificacao_ativa.nota).toFixed(1)} · ${esc((CATEGORIA_INFO[o.classificacao_ativa.categoria] || {}).label || o.classificacao_ativa.categoria)}`
      : "sem classificação";
    return `<div class="campo">
      <span class="rotulo">${formatData(o.created_at)} (${esc(STATUS_LABEL[o.status] || o.status)}):</span>
      <span class="valor">${Number(o.pontuacao)} ${esc(o.unidade_pontuacao)} — ${nota}</span>
    </div>`;
  }).join("");
  if (ofertas.length > LIMITE_HISTORICO_PARCEIRO) {
    linhas += `<div class="sem-dados">+ ${ofertas.length - LIMITE_HISTORICO_PARCEIRO} oferta(s) mais antiga(s) não exibida(s).</div>`;
  }
  return `<div id="historico-parceiro-${id}">${linhas}</div>`;
}

/* ---- Seleção e ações em lote ---- */

function alternarUma(id, marcada) {
  if (marcada) selecionadas.add(id); else selecionadas.delete(id);
  const card = document.getElementById(`card-${id}`);
  if (card) card.classList.toggle("selecionado", marcada);
  atualizarBarraLote();
}

function alternarTodas(marcada) {
  document.querySelectorAll('.card-sel input[type="checkbox"]').forEach(cb => {
    cb.checked = marcada;
    alternarUma(cb.dataset.id, marcada);
  });
}

function limparSelecao() {
  document.getElementById("selecionar-tudo").checked = false;
  alternarTodas(false);
}

function atualizarBarraLote() {
  const barra = document.getElementById("barra-lote");
  const n = selecionadas.size;
  barra.classList.toggle("oculta", n === 0);
  document.getElementById("contagem-lote").textContent =
    `${n} promoç${n === 1 ? "ão selecionada" : "ões selecionadas"}`;
}

async function enviarLote(rota, corpo, verbo) {
  const resp = await fetch(`${API_BASE}/${rota}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(corpo),
  });
  if (!resp.ok) {
    alert(`Erro ao ${verbo} em lote (HTTP ${resp.status}).`);
    return;
  }
  const r = await resp.json();
  let msg = `${r.processadas} de ${r.solicitadas} ${verbo}.`;
  if (r.ignoradas.length > 0) {
    msg += `\n\n${r.ignoradas.length} ignorada(s) — já não estavam pendentes ou não foram encontradas.`;
  }
  alert(msg);
  carregar();
}

async function aprovarLote() {
  const ids = [...selecionadas];
  if (ids.length === 0) return;
  if (!confirm(`Aprovar ${ids.length} promoção(ões) selecionada(s)?`)) return;
  enviarLote("aprovar-lote", { ids }, "aprovadas");
}

async function rejeitarLote() {
  const ids = [...selecionadas];
  if (ids.length === 0) return;
  const motivo = prompt(`Motivo da rejeição (aplicado às ${ids.length} selecionadas):`);
  if (motivo === null) return;
  enviarLote("rejeitar-lote", { ids, motivo_rejeicao: motivo || "Rejeição em lote" }, "rejeitadas");
}

function formatUnidade(unidade) {
  if (unidade === "pontos_por_real") return "pontos por R$ 1";
  if (unidade === "pontos_por_dolar") return "pontos por U$ 1";
  return unidade;
}

function formatOrigem(p) {
  if (p.origem === "COLETOR") return "📥 " + (p.origem_detalhe || "Coletor");
  if (p.origem === "MANUAL") return "✍️ Manual";
  if (p.origem === "IMPORTACAO") return "📄 Importação";
  return p.origem;
}

function formatData(isoString) {
  const d = new Date(isoString);
  return d.toLocaleString("pt-BR", {
    day: "2-digit", month: "2-digit", year: "numeric",
    hour: "2-digit", minute: "2-digit",
  });
}

async function reprocessarTodas() {
  if (!confirm("Reprocessar todas as promoções pendentes/aprovadas com o motor atual? Pode levar alguns segundos.")) return;
  const contador = document.getElementById("contador");
  contador.textContent = "Reprocessando…";
  try {
    const resp = await fetch(`${API_BASE}/reclassificar-todas`, { method: "POST" });
    const resultado = await resp.json();
    alert(`Reprocessado: ${resultado.processadas} de ${resultado.total} (${resultado.erros} erros).`);
  } catch (e) {
    alert("Erro ao reprocessar. A API está rodando?");
  }
  carregar();
}

function renderAcoes(p) {
  if (p.status === "PENDENTE") {
    return `
      <button class="acao btn-aprovar" onclick="aprovar('${p.id}')">Aprovar</button>
      <button class="acao btn-rejeitar" onclick="rejeitar('${p.id}')">Rejeitar</button>
    `;
  }
  if (p.status === "APROVADA" || p.status === "REJEITADA") {
    return `<div class="status-pill status-${p.status}">${p.status === "APROVADA" ? "Aprovada" : "Rejeitada"}</div>`;
  }
  return `<div class="status-pill">${p.status}</div>`;
}

async function aprovar(id) {
  await fetch(`${API_BASE}/${id}/aprovar`, { method: "POST" });
  carregar();
}

async function rejeitar(id) {
  const motivo = prompt("Motivo da rejeição:");
  if (motivo === null) return; // cancelou
  await fetch(`${API_BASE}/${id}/rejeitar`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ motivo_rejeicao: motivo || "Sem motivo especificado" }),
  });
  carregar();
}

iniciar();
</script>
